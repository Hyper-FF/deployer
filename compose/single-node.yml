services:
  starrocks:
    image: starrocks/allin1-ubuntu:${STARROCKS_VERSION}
    container_name: ${CLUSTER_NAME}-allin1
    hostname: ${CLUSTER_NAME}-allin1
    restart: unless-stopped
    environment:
      RUN_MODE: ${RUN_MODE}
      MYSQL_PASSWORD: ${ROOT_PASSWORD}
    ports:
      - "${FE_QUERY_PORT}:9030"
      - "${FE_HTTP_PORT}:8030"
      - "8080:8080"   # feproxy (stream load)
    volumes:
      - sr_meta:/data/deploy/starrocks/fe/meta
      - sr_storage:/data/deploy/starrocks/be/storage
      - sr_logs:/data/deploy/starrocks/fe/log
      - sr_be_logs:/data/deploy/starrocks/be/log
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -P 9030 -u root -e 'show frontends' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - sr_net

volumes:
  sr_meta:
  sr_storage:
  sr_logs:
  sr_be_logs:

networks:
  sr_net:
    name: ${CLUSTER_NAME}_net
