# StarRocks FE configuration overrides used by the deployer.
# This file is mounted into each FE container via CONFIGMAP_MOUNT_PATH and
# replaces the in-image fe.conf at startup.

LOG_DIR = ${STARROCKS_HOME}/log
DATE = "$(date +%Y%m%d-%H%M%S)"
JAVA_OPTS_FOR_JDK_11="-Dlog4j2.formatMsgNoLookups=true -Xmx8192m -XX:+UseG1GC -Xlog:gc*:${LOG_DIR}/fe.gc.log.$DATE:time"

http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010
mysql_service_nio_enabled = true

sys_log_level = INFO
sys_log_verbose_modules =
