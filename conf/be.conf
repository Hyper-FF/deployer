# StarRocks BE configuration overrides used by the deployer.
# This file is mounted into each BE container via CONFIGMAP_MOUNT_PATH and
# replaces the in-image be.conf at startup.

be_port = 9060
webserver_port = 8040
heartbeat_service_port = 9050
brpc_port = 8060

sys_log_level = INFO

# Reasonable defaults for a containerised BE. Override as needed.
mem_limit = 80%
default_rowset_type = beta
